<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Space Battle Game | Tanshu</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #020617;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            flex-direction: column;

            align-items: center;

            min-height: 100vh;

            overflow: hidden;

            touch-action: none;

        }

        h1 {

            color: #60a5fa;

            margin: 10px 0 5px;

            text-shadow: 0 0 15px #2563eb;

        }

        .info {

            display: flex;

            gap: 35px;

            font-size: 18px;

            margin-bottom: 10px;

        }

        #game {

            position: relative;

            width: 900px;

            max-width: 95vw;

            height: 600px;

            max-height: 70vh;

            background:

                radial-gradient(circle at 20% 20%, #1e293b 1px, transparent 2px),

                radial-gradient(circle at 70% 40%, #475569 1px, transparent 2px),

                radial-gradient(circle at 40% 80%, #334155 1px, transparent 2px),

                #020617;

            background-size: 120px 120px;

            border: 2px solid #2563eb;

            border-radius: 15px;

            overflow: hidden;

            box-shadow: 0 0 35px rgba(37, 99, 235, 0.4);

        }

        #player {

            position: absolute;

            width: 55px;

            height: 55px;

            background: #2563eb;

            clip-path: polygon(

                50% 0%,

                100% 100%,

                50% 75%,

                0% 100%

            );

            left: 50%;

            bottom: 25px;

            transform: translateX(-50%);

            filter: drop-shadow(0 0 10px #3b82f6);

        }

        .bullet {

            position: absolute;

            width: 5px;

            height: 18px;

            background: #facc15;

            border-radius: 5px;

            box-shadow: 0 0 10px #facc15;

        }

        .enemy {

            position: absolute;

            width: 50px;

            height: 40px;

            background: #dc2626;

            clip-path: polygon(

                50% 0%,

                100% 35%,

                80% 100%,

                20% 100%,

                0% 35%

            );

            box-shadow: 0 0 15px #ef4444;

        }

        .explosion {

            position: absolute;

            width: 60px;

            height: 60px;

            border-radius: 50%;

            background: #f97316;

            box-shadow:

                0 0 20px #f97316,

                0 0 40px #facc15;

            animation: explode 0.3s forwards;

        }

        @keyframes explode {

            from {

                transform: scale(0.3);

                opacity: 1;

            }

            to {

                transform: scale(1.7);

                opacity: 0;

            }

        }

        #gameOver {

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.82);

            display: none;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            z-index: 20;

        }

        #gameOver h2 {

            color: #ef4444;

            font-size: 45px;

            margin: 10px;

        }

        #gameOver p {

            font-size: 20px;

        }

        .restart {

            padding: 13px 28px;

            border: none;

            border-radius: 25px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }

        .controls {

            margin-top: 10px;

            color: #94a3b8;

            text-align: center;

        }

        .touch-controls {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            margin-top: 12px;

        }

        .touch-btn {

            width: 65px;

            height: 55px;

            border: none;

            border-radius: 15px;

            background: #1e293b;

            color: white;

            font-size: 25px;

            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);

            -webkit-tap-highlight-color: transparent;

            user-select: none;

        }

        .shoot-btn {

            width: 85px;

            background: #dc2626;

            font-size: 18px;

        }

        .touch-btn:active {

            transform: scale(0.92);

        }

        .back {

            margin-top: 8px;

            color: #60a5fa;

            text-decoration: none;

        }

        @media (max-width: 600px) {

            h1 {

                font-size: 26px;

            }

            .info {

                gap: 25px;

                font-size: 15px;

            }

            #game {

                width: 94vw;

                height: 58vh;

            }

            .controls {

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <h1>🚀 Space Battle</h1>


    <div class="info">

        <div>

            ❤️ Health:
            <span id="health">100</span>

        </div>

        <div>

            ⭐ Score:
            <span id="score">0</span>

        </div>

    </div>


    <div id="game">


        <div id="player"></div>


        <div id="gameOver">

            <h2>GAME OVER</h2>

            <p>

                Final Score:
                <span id="finalScore">0</span>

            </p>

            <button
                class="restart"
                onclick="restartGame()">

                🔄 Play Again

            </button>

        </div>


    </div>


    <div class="touch-controls">

        <button
            class="touch-btn"
            id="leftBtn">

            ◀

        </button>


        <button
            class="touch-btn shoot-btn"
            id="shootBtn">

            🔥 FIRE

        </button>


        <button
            class="touch-btn"
            id="rightBtn">

            ▶

        </button>

    </div>


    <div class="controls">

        PC: ⬅️ ➡️ Move &nbsp; | &nbsp; SPACE = Shoot

    </div>


    <a
        class="back"
        href="index.html">

        ← Back to Tanshu

    </a>


    <script>


        const game =
            document.getElementById("game");


        const player =
            document.getElementById("player");


        const healthText =
            document.getElementById("health");


        const scoreText =
            document.getElementById("score");


        const gameOver =
            document.getElementById("gameOver");


        const finalScore =
            document.getElementById("finalScore");


        const leftBtn =
            document.getElementById("leftBtn");


        const rightBtn =
            document.getElementById("rightBtn");


        const shootBtn =
            document.getElementById("shootBtn");


        let playerX = 0;

        let health = 100;

        let score = 0;

        let bullets = [];

        let enemies = [];

        let keys = {};

        let touchLeft = false;

        let touchRight = false;

        let gameRunning = true;


        function setupPlayer() {

            playerX =
                (game.clientWidth -
                player.offsetWidth) / 2;

            player.style.left =
                playerX + "px";

        }


        setupPlayer();


        window.addEventListener("resize", () => {

            if (
                playerX >
                game.clientWidth -
                player.offsetWidth
            ) {

                playerX =
                    game.clientWidth -
                    player.offsetWidth;

            }

            player.style.left =
                playerX + "px";

        });


        // PC KEYBOARD


        document.addEventListener("keydown", (e) => {

            keys[e.code] = true;

            if (e.code === "Space") {

                e.preventDefault();

                shoot();

            }

        });


        document.addEventListener("keyup", (e) => {

            keys[e.code] = false;

        });


        // TOUCH CONTROLS


        function startLeft(e) {

            e.preventDefault();

            touchLeft = true;

        }


        function stopLeft(e) {

            e.preventDefault();

            touchLeft = false;

        }


        function startRight(e) {

            e.preventDefault();

            touchRight = true;

        }


        function stopRight(e) {

            e.preventDefault();

            touchRight = false;

        }


        leftBtn.addEventListener(
            "touchstart",
            startLeft,
            { passive: false }
        );


        leftBtn.addEventListener(
            "touchend",
            stopLeft,
            { passive: false }
        );


        leftBtn.addEventListener(
            "touchcancel",
            stopLeft,
            { passive: false }
        );


        rightBtn.addEventListener(
            "touchstart",
            startRight,
            { passive: false }
        );


        rightBtn.addEventListener(
            "touchend",
            stopRight,
            { passive: false }
        );


        rightBtn.addEventListener(
            "touchcancel",
            stopRight,
            { passive: false }
        );


        // Mouse support for computer


        leftBtn.addEventListener(
            "mousedown",
            () => {

                touchLeft = true;

            }
        );


        leftBtn.addEventListener(
            "mouseup",
            () => {

                touchLeft = false;

            }
        );


        leftBtn.addEventListener(
            "mouseleave",
            () => {

                touchLeft = false;

            }
        );


        rightBtn.addEventListener(
            "mousedown",
            () => {

                touchRight = true;

            }
        );


        rightBtn.addEventListener(
            "mouseup",
            () => {

                touchRight = false;

            }
        );


        rightBtn.addEventListener(
            "mouseleave",
            () => {

                touchRight = false;

            }
        );


        shootBtn.addEventListener(
            "touchstart",
            (e) => {

                e.preventDefault();

                shoot();

            },

            { passive: false }

        );


        shootBtn.addEventListener(
            "mousedown",
            (e) => {

                e.preventDefault();

                shoot();

            }

        );


        function shoot() {

            if (!gameRunning)
                return;


            const bullet =
                document.createElement("div");


            bullet.className =
                "bullet";


            const bulletX =
                playerX +
                player.offsetWidth / 2 -
                2.5;


            bullet.style.left =
                bulletX + "px";


            bullet.style.top =
                (game.clientHeight - 80) + "px";


            game.appendChild(bullet);


            bullets.push({

                element: bullet,

                x: bulletX,

                y: game.clientHeight - 80

            });

        }


        function createEnemy() {

            if (!gameRunning)
                return;


            const enemy =
                document.createElement("div");


            enemy.className =
                "enemy";


            const x =
                Math.random() *
                (game.clientWidth - 50);


            enemy.style.left =
                x + "px";


            enemy.style.top =
                "-50px";


            game.appendChild(enemy);


            enemies.push({

                element: enemy,

                x: x,

                y: -50,

                speed:
                    1.5 +
                    Math.random() * 1.5

            });

        }


        function explode(x, y) {

            const explosion =
                document.createElement("div");


            explosion.className =
                "explosion";


            explosion.style.left =
                x + "px";


            explosion.style.top =
                y + "px";


            game.appendChild(explosion);


            setTimeout(() => {

                explosion.remove();

            }, 300);

        }


        function collision(a, b) {

            return (

                a.x <
                b.x + b.width &&

                a.x + a.width >
                b.x &&

                a.y <
                b.y + b.height &&

                a.y + a.height >
                b.y

            );

        }


        function gameLoop() {

            if (!gameRunning)
                return;


            // PLAYER MOVEMENT


            if (
                keys["ArrowLeft"] ||
                keys["KeyA"] ||
                touchLeft
            ) {

                playerX -= 5;

            }


            if (
                keys["ArrowRight"] ||
                keys["KeyD"] ||
                touchRight
            ) {

                playerX += 5;

            }


            if (playerX < 0) {

                playerX = 0;

            }


            if (
                playerX >
                game.clientWidth -
                player.offsetWidth
            ) {

                playerX =
                    game.clientWidth -
                    player.offsetWidth;

            }


            player.style.left =
                playerX + "px";


            // BULLETS


            bullets.forEach(
                (bullet, bulletIndex) => {

                    bullet.y -= 8;


                    bullet.element.style.top =
                        bullet.y + "px";


                    if (bullet.y < -20) {

                        bullet.element.remove();

                        bullets.splice(
                            bulletIndex,
                            1
                        );

                    }

                }
            );


            // ENEMIES


            enemies.forEach(
                (enemy, enemyIndex) => {

                    enemy.y += enemy.speed;


                    enemy.element.style.top =
                        enemy.y + "px";


                    if (
                        enemy.y >
                        game.clientHeight - 80
                    ) {

                        health -= 20;


                        healthText.textContent =
                            health;


                        enemy.element.remove();


                        enemies.splice(
                            enemyIndex,
                            1
                        );


                        if (health <= 0) {

                            endGame();

                        }

                        return;

                    }


                    // BULLET COLLISION


                    bullets.forEach(
                        (bullet, bulletIndex) => {

                            const bulletRect = {

                                x: bullet.x,

                                y: bullet.y,

                                width: 5,

                                height: 18

                            };


                            const enemyRect = {

                                x: enemy.x,

                                y: enemy.y,

                                width: 50,

                                height: 40

                            };


                            if (
                                collision(
                                    bulletRect,
                                    enemyRect
                                )
                            ) {

                                explode(
                                    enemy.x,
                                    enemy.y
                                );


                                enemy.element.remove();


                                bullet.element.remove();


                                enemies.splice(
                                    enemyIndex,
                                    1
                                );


                                bullets.splice(
                                    bulletIndex,
                                    1
                                );


                                score += 10;


                                scoreText.textContent =
                                    score;

                            }

                        }
                    );

                }
            );


            requestAnimationFrame(gameLoop);

        }


        function endGame() {

            gameRunning = false;


            finalScore.textContent =
                score;


            gameOver.style.display =
                "flex";

        }


        function restartGame() {

            bullets.forEach(
                bullet => {

                    bullet.element.remove();

                }
            );


            enemies.forEach(
                enemy => {

                    enemy.element.remove();

                }
            );


            bullets = [];

            enemies = [];

            health = 100;

            score = 0;

            touchLeft = false;

            touchRight = false;


            healthText.textContent =
                health;


            scoreText.textContent =
                score;


            gameRunning = true;


            gameOver.style.display =
                "none";


            setupPlayer();


            gameLoop();

        }


        setInterval(
            createEnemy,
            900
        );


        gameLoop();

    </script>


</body>

</html>
