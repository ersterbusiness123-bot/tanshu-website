<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calculator | Tanshu</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #050816;

            color: white;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .calculator {

            width: 330px;

            background: #111827;

            padding: 25px;

            border-radius: 25px;

            border: 1px solid #1f2937;

            box-shadow:
                0 0 40px rgba(37, 99, 235, 0.3);

        }

        h1 {

            text-align: center;

            color: #60a5fa;

            margin-bottom: 20px;

        }

        #display {

            width: 100%;

            height: 65px;

            background: #020617;

            color: white;

            border: 1px solid #334155;

            border-radius: 12px;

            font-size: 25px;

            text-align: right;

            padding: 10px;

            margin-bottom: 15px;

        }

        .buttons {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

        }

        button {

            height: 55px;

            border: none;

            border-radius: 12px;

            background: #1e293b;

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;

        }

        button:hover {

            background: #2563eb;

            transform: scale(1.03);

        }

        .clear {

            background: #dc2626;

        }

        .equal {

            background: #2563eb;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #60a5fa;

            text-decoration: none;

        }

    </style>

</head>


<body>


    <div class="calculator">

        <h1>
            🧮 Calculator
        </h1>


        <input
            id="display"
            type="text"
            readonly
        >


        <div class="buttons">

            <button
                class="clear"
                onclick="clearDisplay()">
                C
            </button>

            <button
                onclick="deleteLast()">
                ⌫
            </button>

            <button
                onclick="add('%')">
                %
            </button>

            <button
                onclick="add('/')">
                ÷
            </button>


            <button onclick="add('7')">
                7
            </button>

            <button onclick="add('8')">
                8
            </button>

            <button onclick="add('9')">
                9
            </button>

            <button onclick="add('*')">
                ×
            </button>


            <button onclick="add('4')">
                4
            </button>

            <button onclick="add('5')">
                5
            </button>

            <button onclick="add('6')">
                6
            </button>

            <button onclick="add('-')">
                −
            </button>


            <button onclick="add('1')">
                1
            </button>

            <button onclick="add('2')">
                2
            </button>

            <button onclick="add('3')">
                3
            </button>

            <button onclick="add('+')">
                +
            </button>


            <button onclick="add('0')">
                0
            </button>

            <button onclick="add('.')">
                .
            </button>

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>

        </div>


        <a
            class="back"
            href="index.html">

            ← Back to Tanshu

        </a>

    </div>


    <script>

        const display =
            document.getElementById("display");


        function add(value) {

            display.value += value;

        }


        function clearDisplay() {

            display.value = "";

        }


        function deleteLast() {

            display.value =
                display.value.slice(0, -1);

        }


        function calculate() {

            try {

                display.value =
                    Function(
                        "return " +
                        display.value
                    )();

            }

            catch {

                display.value = "Error";

            }

        }

    </script>


</body>

</html>
