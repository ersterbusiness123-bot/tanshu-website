<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Space Battle | Tanshu</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #050816;

            color: white;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .box {

            width: 90%;

            max-width: 700px;

            background: #111827;

            padding: 50px;

            border-radius: 25px;

            border: 1px solid #1f2937;

            text-align: center;

            box-shadow:
                0 0 40px rgba(37, 99, 235, 0.3);

        }

        h1 {

            font-size: 45px;

            color: #60a5fa;

            text-shadow:
                0 0 20px #2563eb;

            margin-bottom: 20px;

        }

        p {

            color: #cbd5e1;

            font-size: 18px;

            line-height: 1.7;

        }

        .features {

            background: #020617;

            padding: 20px;

            border-radius: 15px;

            margin: 25px 0;

            line-height: 2;

            color: #cbd5e1;

        }

        .back {

            display: inline-block;

            margin-top: 20px;

            padding: 13px 25px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 25px;

            transition: 0.3s;

        }

        .back:hover {

            background: #3b82f6;

            transform: translateY(-3px);

            box-shadow:
                0 0 20px rgba(59, 130, 246, 0.6);

        }

    </style>

</head>


<body>


    <div class="box">

        <h1>
            🎮 Space Battle
        </h1>

        <p>
            A space battle game created using
            Python and Pygame.
        </p>


        <div class="features">

            🚀 Player Spaceship<br>

            ⚔️ Enemy Battleship<br>

            🔫 Shooting System<br>

            ❤️ Health System<br>

            💥 Enemy Destruction

        </div>


        <p>
            This project is part of my programming journey.
        </p>


        <a
            class="back"
            href="index.html">

            ← Back to Tanshu

        </a>

    </div>


</body>

</html>
